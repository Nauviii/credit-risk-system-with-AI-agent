[tool.poetry]
name = "credit-risk-system"
version = "0.1.0"
description = "End-to-end PD credit risk system (Lending Club)"
packages = [{ include = "credit_risk", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2"
polars = "^1.9"
pyarrow = "^17.0"
numpy = "^1.26"
scikit-learn = "^1.4"
lightgbm = "^4.3"
optuna = "^3.6"
shap = "^0.45"
pandera = "^0.19"
pydantic = "^2.7"
pydantic-settings = "^2.2"
pyyaml = "^6.0"
python-dotenv = "^1.0"
mlflow = "^2.13"
matplotlib = "^3.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.4"
black = "^24.4"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"