[project]
name = "credit-risk-system"
version = "0.1.0"
description = "End-to-end PD credit risk system (Lending Club)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "polars>=1.9",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "shap>=0.45",
    "pandera>=0.19",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "mlflow>=2.13",
    "matplotlib>=3.8",
    "numba>=0.60",
    "optuna-integration>=4.9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "black>=24.4",
    "pre-commit>=3.7",
    "httpx>=0.27",  # required by fastapi.testclient
]

[tool.pytest.ini_options]
pythonpath = ["src"]

# Both tools are pinned explicitly rather than left on defaults, so CI and a developer's
# machine cannot disagree because they resolved different minor versions.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is black's job, and it disagrees with ruff at the margin
    "B008",    # function call in default argument - intentional in a few signatures
    "SIM108",  # ternary-instead-of-if is often less readable in numeric code
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside functions on purpose, to keep optional heavy deps (shap, lightgbm)
# out of collection when a single unrelated test file is run.
"tests/*" = ["E402", "F401"]

[tool.black]
line-length = 100
target-version = ["py312"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]